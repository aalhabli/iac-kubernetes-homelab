# Games the capture timer should fire on.
#
# Format:  <slug>  <extended regex>
#
# The regex is matched case-insensitively against both the Hyprland window class
# and the window title, so either can identify the game. The slug becomes the
# output directory name under ~/Pictures/game-captures/.
#
# Proton games usually present a class of steam_app_<appid>, and the appid is
# the stable identifier. Run `game-capture --which` with the game focused to
# read its actual class, then add or correct the pattern here.

# Total War: ATTILA (steam 325610) plus the non-Steam Total War installs
total-war        steam_app_325610|total.?war|attila|pharaoh|rome.?ii|shogun.?2|three.?kingdoms

# Hearts of Iron IV
hoi4             hoi4|hearts.?of.?iron

# WARNO
warno            warno|eugen

# HighFleet
highfleet        highfleet

# Arma Reforger (steam 1890860) — tactical rather than grand strategy, but the
# after-action review is the same shape.
arma-reforger    steam_app_1890860|arma.?reforger
